[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "0s"
  precision = ""
  logfile = ""
  quiet = false
  hostname = "modbus-telegraf"
  omit_hostname = false

###############################################################################
#                            INPUTS                                           #
###############################################################################

[[inputs.modbus]]
  name = "modbus_device"
  ## Dirección del PLC / dispositivo Modbus TCP
  controller = "tcp://192.168.0.10:502"
  ## Timeout
  timeout = "5s"

  ## Tipo de holding registers (la mayoría de PLCs)
  holding_registers = [
    # Ejemplo: temperatura FLOAT32 empezando en 0 y 2 registros
    { name = "temperature",   byte_order = "ABCD", data_type = "FLOAT32-IEEE", scale=1.0, address = [0] },
    # Ejemplo: presión FLOAT32 empezando en 2
    { name = "pressure",      byte_order = "ABCD", data_type = "FLOAT32-IEEE", scale=1.0, address = [2] },
    # Ejemplo: contador UINT16 en 10
    { name = "counter",       byte_order = "AB",   data_type = "UINT16",       scale=1.0, address = [10] }
  ]

###############################################################################
#                            OUTPUTS                                          #
###############################################################################

[[inputs.internal]]
  # métricas internas de telegraf (opcional)
  collect_memstats = true

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

  ## Opcional, tuneo de escritura
  timeout = "10s"
  batch_size = 5000
  flush_interval = "10s"
